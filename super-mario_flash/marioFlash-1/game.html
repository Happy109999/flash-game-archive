<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super mario Flash</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 15px 0 10px;
  }

  .buttons {
    margin-bottom: 10px;
  }

  button {
    padding: 8px 14px;
    margin: 0 5px;
    background: #111;
    color: white;
    border: 2px solid white;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: white;
    color: black;
  }

  /* WINDOWED GAME AREA */
  #game {
    width: 800px;
    height: 600px;
    border: 2px solid white;
    background: black;
  }

  /* Mobile scaling */
  @media (max-width: 850px) {
    #game {
      width: 95vw;
      height: calc(95vw * 0.75);
    }
  }
</style>
</head>

<body>

<h1>Super mario Flash</h1>

<div class="buttons">
  <button onclick="history.back()">⬅ Back</button>
  <button onclick="fullscreen()">⛶ Fullscreen</button>
</div>

<div id="game"></div>

<script>
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  player.style.width = "100%";
  player.style.height = "100%";

  document.getElementById("game").appendChild(player);

  // LOAD YOUR GAME
  player.load("Super Mario Flash.swf");

  function fullscreen() {
    document.getElementById("game").requestFullscreen();
  }
</script>

</body>
</html>
