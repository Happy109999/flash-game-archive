<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Flash 1</title>

  <!-- Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
    }

    /* Disclaimer overlay */
    #disclaimer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .disclaimer-box {
      background: #111;
      border: 2px solid white;
      padding: 25px;
      max-width: 500px;
      text-align: center;
      border-radius: 12px;
    }

    .disclaimer-box button {
      margin-top: 15px;
      padding: 10px 20px;
      background: black;
      color: white;
      border: 2px solid white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }

    .disclaimer-box button:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>

  <!-- Disclaimer -->
  <div id="disclaimer">
    <div class="disclaimer-box">
      <h2>Disclaimer</h2>
      <p>
        <strong>Super Mario Flash</strong> is a discontinued fan-made Flash game.
      </p>
      <p>
        Mario and related characters are the property of <strong>Nintendo</strong>.
      </p>
      <p>
        This game is preserved for <strong>archival and historical purposes only</strong>.
      </p>
      <button onclick="acceptDisclaimer()">I Understand</button>
    </div>
  </div>

  
  <div id="container"></div>

  
  <script>
    function acceptDisclaimer() {
      document.getElementById("disclaimer").style.display = "none";
    }

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    document.getElementById("container").appendChild(player);

    
    player.load("Super Mario Flash.swf");
  </script>

</body>
</html>
